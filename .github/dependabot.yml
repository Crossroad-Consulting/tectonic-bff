version: 2
registries:
  github:
    type: git
    url: https://github.com/
    username: x-access-token
    password: ${{secrets.GH_TOKEN}}
updates:
- package-ecosystem: "gomod"
  directory: "/"
  registries: "*"
  schedule:
    interval: "weekly"

- package-ecosystem: "docker"
  directories:
  - "/.devcontainer"
  - "/tailwind"
  - "/"
  schedule:
    interval: "weekly"

- package-ecosystem: "github-actions"
  directory: "/"
  registries: "*"
  schedule:
    interval: "weekly"

- package-ecosystem: "npm"
  directory: "/tailwind"
  registries: "*"
  schedule:
    interval: "weekly"